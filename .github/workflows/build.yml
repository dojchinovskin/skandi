name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    name: Generator (Kotlin, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and newest LTS, so a fresh JDK on either laptop is covered.
        java: [17, 25]
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      # build = compile + unit tests + validatePuzzles (data/site/puzzles) + checkWords (data/words/words.tsv)
      - run: ./gradlew build

  web:
    name: Website (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
